<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tristan Graves</title>
<meta name="description" content="Tristan Graves — artist, engineer, founder. Perception LLC." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- ============================================================= -->
<!--  EDIT EVERYTHING IN THE CONFIG BLOCK AT THE BOTTOM OF THIS    -->
<!--  FILE (just before </body>). Drop your real URLs in there     -->
<!--  and the page updates itself. Nothing else needs touching.    -->
<!-- ============================================================= -->

<style>
  :root {
    --bg:        #08070F;
    --bg-raise:  #100E20;
    --text:      #ECEAF6;
    --muted:     #8E89A8;
    --border:    rgba(255,255,255,0.08);
    --border-hi: rgba(185,174,255,0.45);
    --accent:    #B9AEFF;
    --glow-violet: #6D5BF0;
    --glow-rose:   #E879A6;
    --maxw: 520px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--bg); }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 22px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- signature: drifting nocturnal aurora ---- */
  .aurora { position: fixed; inset: -20% -20% -20% -20%; z-index: 0; pointer-events: none; filter: blur(90px); opacity: 0.55; }
  .aurora span { position: absolute; border-radius: 50%; }
  .aurora .v {
    width: 60vmax; height: 60vmax; top: -18vmax; left: -10vmax;
    background: radial-gradient(circle at center, var(--glow-violet), transparent 62%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .aurora .r {
    width: 48vmax; height: 48vmax; bottom: -16vmax; right: -8vmax;
    background: radial-gradient(circle at center, var(--glow-rose), transparent 64%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(8vmax, 6vmax) scale(1.12); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-7vmax,-5vmax) scale(1.15); } }

  /* grain / vignette to keep it premium, not flat */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  .wrap { position: relative; z-index: 2; width: 100%; max-width: var(--maxw); text-align: center; }

  /* ---- avatar ---- */
  .avatar {
    width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 26px;
    display: grid; place-items: center; position: relative;
    background: linear-gradient(140deg, #2a2550, #15122e);
    box-shadow: 0 0 0 1px var(--border), 0 0 44px -8px var(--glow-violet);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar .mono {
    font-family: "Instrument Serif", serif; font-size: 40px; letter-spacing: 1px;
    color: var(--text); opacity: 0.9;
  }

  /* ---- header ---- */
  h1 {
    font-family: "Instrument Serif", serif; font-weight: 400;
    font-size: clamp(46px, 12vw, 64px); line-height: 0.96; letter-spacing: 0.5px;
  }
  .roles {
    margin-top: 14px; font-size: 12px; font-weight: 500;
    letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent);
  }
  .bio {
    margin: 22px auto 0; max-width: 420px; font-size: 15px; line-height: 1.6;
    color: var(--muted);
  }
  .bio em { font-family: "Instrument Serif", serif; font-style: italic; color: var(--text); font-size: 1.12em; }

  /* ---- link rows ---- */
  .links { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
  .row {
    display: flex; align-items: center; gap: 15px; text-align: left;
    padding: 15px 17px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    color: var(--text); text-decoration: none;
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
  }
  .row:hover, .row:focus-visible {
    transform: translateY(-2px);
    border-color: var(--border-hi);
    box-shadow: 0 12px 34px -16px var(--glow-violet);
    background: linear-gradient(180deg, rgba(185,174,255,0.10), rgba(255,255,255,0.02));
    outline: none;
  }
  .row .ic {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(185,174,255,0.10); border: 1px solid var(--border);
    color: var(--accent);
  }
  .row .ic svg { width: 20px; height: 20px; }
  .row .txt { flex: 1 1 auto; min-width: 0; }
  .row .label { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: 0.1px; }
  .row .sub { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .row .arrow { flex: 0 0 auto; color: var(--muted); transition: transform .22s ease, color .22s ease; }
  .row:hover .arrow, .row:focus-visible .arrow { transform: translateX(4px); color: var(--accent); }

  /* ---- socials ---- */
  .socials { margin-top: 30px; display: flex; justify-content: center; gap: 16px; }
  .socials a {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--muted);
    transition: transform .2s ease, color .2s ease, border-color .2s ease, background .2s ease;
  }
  .socials a:hover, .socials a:focus-visible {
    transform: translateY(-3px); color: var(--text);
    border-color: var(--border-hi); background: rgba(185,174,255,0.10);
    outline: none;
  }
  .socials svg { width: 19px; height: 19px; fill: currentColor; }

  footer { margin-top: 38px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(142,137,168,0.6); }

  @media (prefers-reduced-motion: reduce) {
    .aurora .v, .aurora .r { animation: none; }
    .row, .row .arrow, .socials a { transition: none; }
  }
</style>
</head>
<body>
  <div class="aurora"><span class="v"></span><span class="r"></span></div>

  <main class="wrap">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="roles" id="roles"></p>
    <p class="bio" id="bio"></p>

    <nav class="links" id="links" aria-label="Projects"></nav>
    <nav class="socials" id="socials" aria-label="Social media"></nav>

    <footer id="footer"></footer>
  </main>

<script>
/* ================================================================ */
/*  >>> CONFIG — EDIT THIS BLOCK ONLY <<<                            */

  // Link rows — music first for the rollout. Swap/add rows any time.

    { label: "SHOUTOUT TO MY EX &lt;/3",  sub: "the new single · out now",            url: "https://unitedmasters.com/m/shoutout-to-my-ex-3",              icon: "spark"  },

  play:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg>',

  // social icons (filled, simple-icons style)
  instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>',

  x:         '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg>',

};

/* render */
(function () {
  const $ = (id) => document.getElementById(id);

  // avatar
  const av = $("avatar");
  const showMono = () => {
    const initials = CONFIG.name.split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
    av.innerHTML = '<span class="mono">' + initials + '</span>';
  };
  if (CONFIG.avatar) {
    const img = new Image();
    img.alt = CONFIG.name;
    img.onload = () => { av.innerHTML = ""; av.appendChild(img); };
    img.onerror = showMono;
    img.src = CONFIG.avatar;
    showMono(); // shown until the photo loads (or stays if it can't)
  } else {
    showMono();
  }

  $("name").textContent = CONFIG.name;
  $("roles").textContent = CONFIG.roles;
  $("bio").innerHTML = CONFIG.bio;
  $("footer").textContent = CONFIG.footer;

  // link rows
  $("links").innerHTML = CONFIG.links.map(l => (
    '<a class="row" href="' + l.url + '" target="_blank" rel="noopener">' +
      '<span class="ic">' + (ICONS[l.icon] || ICONS.spark) + '</span>' +
      '<span class="txt"><span class="label">' + l.label + '</span>' +
      '<span class="sub">' + l.sub + '</span></span>' +
      '<span class="arrow">' + ICONS.arrow + '</span>' +
    '</a>'
  )).join("");

  // socials
  $("socials").innerHTML = CONFIG.socials.map(s => (
    '<a href="' + s.url + '" target="_blank" rel="noopener" aria-label="' + s.name + '">' +
      (ICONS[s.icon] || "") +
    '</a>'
  )).join("");
})();
</script>
</body>
</html>
